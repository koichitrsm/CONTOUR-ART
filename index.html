<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>CONTOUR ART</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:#111;font-family:Arial,sans-serif;touch-action:none}
#app{position:fixed;inset:0;background:#fff}
canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:absolute;top:calc(env(safe-area-inset-top) + 17px);left:0;right:0;text-align:center;pointer-events:none}
#title{font-size:12px;letter-spacing:.34em;font-weight:500}
#subtitle{margin-top:8px;font-size:10px;letter-spacing:.08em;color:#777}
#counter{position:absolute;top:calc(env(safe-area-inset-top) + 18px);right:20px;font-size:11px;letter-spacing:.12em;color:#555;pointer-events:none}
#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 22px);left:0;right:0;text-align:center;font-size:10px;letter-spacing:.12em;color:#777;pointer-events:none}
#reset{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 15px);border:1px solid #bbb;border-radius:20px;padding:8px 13px;background:rgba(255,255,255,.94);color:#333;font-size:10px;letter-spacing:.08em}
#reset:active{background:#eee}
</style>
</head>
<body>
<div id="app">
<canvas id="art"></canvas>
<div id="top"><div id="title">CONTOUR ART</div><div id="subtitle">TAP TO CREATE A LANDSCAPE</div></div>
<div id="counter">0 / 5</div>
<div id="hint">画面をタップして頂上をつくる</div>
<button id="reset" type="button">RESET</button>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('art'),ctx=canvas.getContext('2d');
const counter=document.getElementById('counter'),hint=document.getElementById('hint'),reset=document.getElementById('reset');
let W=0,H=0,DPR=1,peaks=[],contours=[],phase='drawing',fadeStart=0;
const MAX_PEAKS=5,LEVELS_PER_PEAK=10,GRID=7,FADE_MS=3200;
let gw=0,gh=0,values=null,levels=[];

function resize(){
 W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(peaks.length)rebuild();else clearCanvas();
}
function clearCanvas(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
 counter.textContent=`${peaks.length} / ${MAX_PEAKS}`;
}
function hashNoise(seed,n){
 const v=Math.sin(seed*127.1+n*311.7)*43758.5453;
 return (v-Math.floor(v))*2-1;
}
function peakField(p,x,y){
 const dx=x-p.x,dy=y-p.y,r=Math.hypot(dx,dy),a=Math.atan2(dy,dx);
 // Smooth, individually distorted hill: several harmonics keep contours organic but nested.
 const shape=1
  +.095*Math.sin(3*a+p.seed)
  +.052*Math.sin(5*a-p.seed*1.7)
  +.026*Math.sin(8*a+p.seed*.63)
  +.018*Math.sin(11*a-p.seed*.4);
 const rx=Math.max(W,H)*.34;
 const rr=r/shape;
 const anis=1+.10*Math.sin(a*2+p.seed*.7);
 const q=rr/(rx*anis);
 return Math.exp(-.5*q*q);
}
function fieldAt(x,y){
 let v=0;
 for(const p of peaks)v+=p.height*peakField(p,x,y);
 return v;
}
function buildGrid(){
 gw=Math.ceil(W/GRID)+1;gh=Math.ceil(H/GRID)+1;
 values=new Float32Array(gw*gh);
 let min=Infinity,max=-Infinity;
 for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
  const v=fieldAt(Math.min(W,x*GRID),Math.min(H,y*GRID));
  values[y*gw+x]=v;min=Math.min(min,v);max=Math.max(max,v);
 }
 return {min,max,span:Math.max(1e-7,max-min)};
}
function getLevels(range){
 const result=[];
 peaks.forEach((p,i)=>{
  let saddle=range.min+range.span*.035;
  if(peaks.length>1){
   let nearest=null,best=Infinity;
   peaks.forEach((q,j)=>{if(i===j)return;const d=Math.hypot(p.x-q.x,p.y-q.y);if(d<best){best=d;nearest=q;}});
   if(nearest){
    // Saddle estimate between this summit and its nearest neighbour.
    const mx=(p.x+nearest.x)/2,my=(p.y+nearest.y)/2;
    saddle=fieldAt(mx,my);
   }
  }
  const summit=fieldAt(p.x,p.y);
  const low=Math.max(range.min+range.span*.012,Math.min(saddle,summit-range.span*.04));
  const high=Math.max(low+range.span*.03,summit-range.span*.025);
  for(let k=0;k<LEVELS_PER_PEAK;k++){
   const t=(k+.55)/LEVELS_PER_PEAK;
   const v=low+(high-low)*t;
   // A shared scalar level is extracted once across the entire landscape.
   // Near-equal summit heights therefore share contour paths and can merge naturally.
   result.push(Math.round(v/(range.span*.0015))*(range.span*.0015));
  }
 });
 const unique=[...new Set(result.map(v=>v.toFixed(7)))].map(Number).sort((a,b)=>a-b);
 return unique;
}
function interpolate(x1,y1,v1,x2,y2,v2,l){
 const d=v2-v1,t=Math.abs(d)<1e-9?.5:(l-v1)/d;
 return {x:(x1+(x2-x1)*t)*GRID,y:(y1+(y2-y1)*t)*GRID};
}
function pointKey(p){return `${Math.round(p.x*10)},${Math.round(p.y*10)}`;}
function extractPaths(level){
 const segs=[];
 for(let y=0;y<gh-1;y++)for(let x=0;x<gw-1;x++){
  const a=values[y*gw+x],b=values[y*gw+x+1],c=values[(y+1)*gw+x+1],d=values[(y+1)*gw+x];
  const pts=[];
  if((a<level)!==(b<level))pts.push(interpolate(x,y,a,x+1,y,b,level));
  if((b<level)!==(c<level))pts.push(interpolate(x+1,y,b,x+1,y+1,c,level));
  if((d<level)!==(c<level))pts.push(interpolate(x,y+1,d,x+1,y+1,c,level));
  if((a<level)!==(d<level))pts.push(interpolate(x,y,a,x,y+1,d,level));
  if(pts.length===2)segs.push(pts);
  else if(pts.length===4){
   const center=(a+b+c+d)*.25;
   if((a>=level)===(center>=level))segs.push([pts[0],pts[3]],[pts[1],pts[2]]);
   else segs.push([pts[0],pts[1]],[pts[2],pts[3]]);
  }
 }
 const adj=new Map(),used=new Uint8Array(segs.length);
 segs.forEach((s,i)=>s.forEach(p=>{const k=pointKey(p);if(!adj.has(k))adj.set(k,[]);adj.get(k).push(i);}));
 const paths=[];
 function walk(start,first){
  let k=start,id=first,path=[],guard=0;
  while(id!==undefined&&!used[id]&&guard++<segs.length+2){
   used[id]=1;const s=segs[id],forward=pointKey(s[0])===k;
   const from=forward?s[0]:s[1],to=forward?s[1]:s[0];
   if(!path.length)path.push(from);path.push(to);k=pointKey(to);
   id=(adj.get(k)||[]).find(n=>!used[n]);
  }
  if(path.length>1)paths.push(path);
 }
 for(const [k,ids] of adj)if(ids.length===1&&!used[ids[0]])walk(k,ids[0]);
 for(let i=0;i<segs.length;i++)if(!used[i])walk(pointKey(segs[i][0]),i);
 return paths;
}
function rebuild(){
 clearCanvas();
 if(!peaks.length){levels=[];contours=[];return;}
 const range=buildGrid();
 levels=getLevels(range);
 contours=levels.map(l=>extractPaths(l));
 drawContours(0,0,1);
}
function drawContours(time=0,wave=0,opacity=1){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
 contours.forEach((paths,li)=>{
  paths.forEach((path,pi)=>{
   if(path.length<2)return;
   ctx.beginPath();
   path.forEach((p,i)=>{
    const wobbleX=wave*Math.sin(p.y*.014+time*.0027+li*.43+pi*.3);
    const wobbleY=wave*.7*Math.sin(p.x*.012-time*.0021+li*.57+pi*.2);
    if(i===0)ctx.moveTo(p.x+wobbleX,p.y+wobbleY);
    else ctx.lineTo(p.x+wobbleX,p.y+wobbleY);
   });
   ctx.strokeStyle=`rgba(0,0,0,${opacity})`;ctx.lineWidth=1;ctx.stroke();
  });
 });
 counter.textContent=`${peaks.length} / ${MAX_PEAKS}`;
}
function addPeak(x,y){
 if(phase!=='drawing'||peaks.length>=MAX_PEAKS)return;
 peaks.push({x,y,seed:Math.random()*Math.PI*2,height:.94+Math.random()*.12});
 rebuild();
 if(peaks.length===MAX_PEAKS){
  hint.textContent='CONTOURS COME ALIVE';
  setTimeout(()=>{if(phase==='drawing'&&peaks.length===MAX_PEAKS){phase='fading';fadeStart=performance.now();requestAnimationFrame(animate);}},700);
 }else hint.textContent='別の場所をタップして頂上を追加';
}
function animate(now){
 if(phase!=='fading')return;
 const t=Math.min(1,(now-fadeStart)/FADE_MS),strength=Math.sin(Math.PI*t);
 drawContours(now,2+24*strength+9*t,Math.pow(1-t,1.12));
 if(t<1)requestAnimationFrame(animate);
 else{peaks=[];contours=[];levels=[];phase='drawing';hint.textContent='画面をタップして頂上をつくる';clearCanvas();}
}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();addPeak(e.clientX,e.clientY);},{passive:false});
reset.addEventListener('click',()=>{peaks=[];contours=[];levels=[];phase='drawing';hint.textContent='画面をタップして頂上をつくる';clearCanvas();});
addEventListener('resize',resize);
resize();
})();
</script>
</body>
</html>
