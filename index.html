<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>CONTOUR ART</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:#111;font-family:Arial,sans-serif;touch-action:none}
#app{position:fixed;inset:0;background:#fff}
canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:absolute;top:calc(env(safe-area-inset-top) + 17px);left:0;right:0;text-align:center;pointer-events:none}
#title{font-size:12px;letter-spacing:.34em;font-weight:500}
#subtitle{margin-top:8px;font-size:10px;letter-spacing:.08em;color:#777}
#counter{position:absolute;top:calc(env(safe-area-inset-top) + 18px);right:20px;font-size:11px;letter-spacing:.12em;color:#555;pointer-events:none}
#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 22px);left:0;right:0;text-align:center;font-size:10px;letter-spacing:.12em;color:#777;pointer-events:none}
#reset{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 15px);border:1px solid #bbb;border-radius:20px;padding:8px 13px;background:rgba(255,255,255,.94);color:#333;font-size:10px;letter-spacing:.08em}
#reset:active{background:#eee}
</style>
</head>
<body>
<div id="app">
<canvas id="art"></canvas>
<div id="top"><div id="title">CONTOUR ART</div><div id="subtitle">TAP TO CREATE A LANDSCAPE</div></div>
<div id="counter">0 / 5</div>
<div id="hint">画面をタップして地形をつくる</div>
<button id="reset" type="button">RESET</button>
</div>
<script>
(()=>{
const canvas=document.getElementById('art'),ctx=canvas.getContext('2d');
const counter=document.getElementById('counter'),hint=document.getElementById('hint'),reset=document.getElementById('reset');
let W=0,H=0,DPR=1,peaks=[],contours=[],phase='drawing',fadeStart=0;
const LEVELS=10,MAX_POINTS=5,GRID=8,FADE_MS=3000;
let gridW=0,gridH=0,gridVals=null,levelValues=[];

function resize(){
 W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(peaks.length) rebuild();
 else clearCanvas();
}
function clearCanvas(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);counter.textContent=`${peaks.length} / ${MAX_POINTS}`;}
function sigma(){return Math.max(W,H)*.43;}
function fieldAt(x,y){
 const s=sigma();let v=0;
 for(const p of peaks){
  const dx=x-p.x,dy=y-p.y;
  // A broad, softly irregular hill. Smooth summed elevation creates continuous contour topology.
  const a=Math.atan2(dy,dx),r=Math.hypot(dx,dy);
  const distortion=1+.075*Math.sin(3*a+p.seed)+.045*Math.sin(5*a-p.seed*1.7)+.025*Math.sin(8*a+p.seed*.6);
  const rr=r/distortion;
  v+=Math.exp(-(rr*rr)/(2*s*s));
 }
 return v;
}
function buildGrid(){
 gridW=Math.ceil(W/GRID)+1;gridH=Math.ceil(H/GRID)+1;
 gridVals=new Float32Array(gridW*gridH);
 let min=Infinity,max=-Infinity;
 for(let y=0;y<gridH;y++)for(let x=0;x<gridW;x++){
  const v=fieldAt(Math.min(W,x*GRID),Math.min(H,y*GRID));
  gridVals[y*gridW+x]=v;if(v<min)min=v;if(v>max)max=v;
 }
 return {min,max};
}
function interp(x1,y1,v1,x2,y2,v2,level){
 const d=v2-v1,t=Math.abs(d)<1e-9?.5:(level-v1)/d;
 return {x:(x1+(x2-x1)*t)*GRID,y:(y1+(y2-y1)*t)*GRID};
}
function key(p){return `${Math.round(p.x*10)},${Math.round(p.y*10)}`;}
function extract(level){
 const segments=[];
 for(let y=0;y<gridH-1;y++)for(let x=0;x<gridW-1;x++){
  const x0=x,y0=y,x1=x+1,y1=y+1;
  const a=gridVals[y0*gridW+x0],b=gridVals[y0*gridW+x1],c=gridVals[y1*gridW+x1],d=gridVals[y1*gridW+x0];
  const pts=[];
  if((a<level)!==(b<level))pts.push(interp(x0,y0,a,x1,y0,b,level)); // top
  if((b<level)!==(c<level))pts.push(interp(x1,y0,b,x1,y1,c,level)); // right
  if((d<level)!==(c<level))pts.push(interp(x0,y1,d,x1,y1,c,level)); // bottom
  if((a<level)!==(d<level))pts.push(interp(x0,y0,a,x0,y1,d,level)); // left
  if(pts.length===2)segments.push([pts[0],pts[1]]);
  else if(pts.length===4){
   // Resolve saddle cells consistently using the cell-center elevation.
   const center=(a+b+c+d)/4;
   if((a>=level)===(center>=level)){
    segments.push([pts[0],pts[3]],[pts[1],pts[2]]);
   }else{
    segments.push([pts[0],pts[1]],[pts[2],pts[3]]);
   }
  }
 }
 // Stitch marching-squares segments into separate non-crossing contour paths.
 const adjacency=new Map(),all=[];
 segments.forEach((s,i)=>{
  const k0=key(s[0]),k1=key(s[1]);
  if(!adjacency.has(k0))adjacency.set(k0,[]);
  if(!adjacency.has(k1))adjacency.set(k1,[]);
  adjacency.get(k0).push(i);adjacency.get(k1).push(i);
  all.push({p:s,used:false});
 });
 const paths=[];
 function walk(startKey,startSeg){
  const path=[],first=all[startSeg].p;
  let currentKey=startKey,segId=startSeg,guard=0;
  while(segId!==undefined&&guard++<segments.length+5){
   const seg=all[segId];if(seg.used)break;seg.used=true;
   const k0=key(seg.p[0]),k1=key(seg.p[1]);
   const forward=currentKey===k0;
   const from=forward?seg.p[0]:seg.p[1],to=forward?seg.p[1]:seg.p[0];
   if(path.length===0)path.push(from);
   path.push(to);
   currentKey=key(to);
   const next=(adjacency.get(currentKey)||[]).find(id=>!all[id].used);
   segId=next;
  }
  if(path.length>1)paths.push(path);
 }
 // Start open paths at endpoints first, then trace any closed loops.
 for(const [k,ids] of adjacency)if(ids.length===1&&!all[ids[0]].used)walk(k,ids[0]);
 for(let i=0;i<all.length;i++)if(!all[i].used)walk(key(all[i].p[0]),i);
 return paths;
}
function chooseLevels(min,max){
 const span=max-min,lo=min+span*.035,hi=max-span*.035;
 const levels=[];
 // The third contour is deliberately placed at the saddle between the newest point
 // and its nearest predecessor, so those two terrain forms merge at that elevation.
 let joinLevel=null;
 if(peaks.length>=2){
  const newest=peaks[peaks.length-1];
  let nearest=peaks[0],best=Infinity;
  for(let i=0;i<peaks.length-1;i++){
   const d=Math.hypot(newest.x-peaks[i].x,newest.y-peaks[i].y);
   if(d<best){best=d;nearest=peaks[i];}
  }
  const mx=(newest.x+nearest.x)/2,my=(newest.y+nearest.y)/2;
  joinLevel=fieldAt(mx,my)-span*.002;
  joinLevel=Math.max(lo+span*.025,Math.min(hi-span*.025,joinLevel));
 }
 if(joinLevel===null){
  for(let i=0;i<LEVELS;i++)levels.push(lo+(hi-lo)*(i+.5)/LEVELS);
 }else{
  const below=joinLevel-lo,above=hi-joinLevel;
  for(let i=0;i<2;i++)levels.push(lo+below*(i+1)/3);
  levels.push(joinLevel);
  for(let i=0;i<7;i++)levels.push(joinLevel+above*(i+1)/8);
 }
 return levels;
}
function rebuild(){
 clearCanvas();
 if(!peaks.length){contours=[];return;}
 const range=buildGrid();levelValues=chooseLevels(range.min,range.max);
 contours=levelValues.map(v=>extract(v));
 drawContours(0,0,1);
}
function drawContours(time=0,wave=0,opacity=1){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
 contours.forEach((paths,li)=>{
  paths.forEach((path,pi)=>{
   if(path.length<2)return;
   ctx.beginPath();
   path.forEach((p,i)=>{
    const dx=wave*Math.sin(p.y*.018+time*.003+li*.55+pi)*Math.sin(time*.0017+p.x*.012);
    const dy=wave*.55*Math.sin(p.x*.015-time*.002+li*.7+pi);
    if(i===0)ctx.moveTo(p.x+dx,p.y+dy);else ctx.lineTo(p.x+dx,p.y+dy);
   });
   ctx.strokeStyle=`rgba(0,0,0,${opacity})`;ctx.lineWidth=1;ctx.stroke();
  });
 });
 counter.textContent=`${peaks.length} / ${MAX_POINTS}`;
}
function addPoint(x,y){
 if(phase!=='drawing'||peaks.length>=MAX_POINTS)return;
 peaks.push({x,y,seed:Math.random()*Math.PI*2});
 rebuild();
 if(peaks.length===MAX_POINTS){
  hint.textContent='CONTOURS COME ALIVE';
  setTimeout(()=>{if(phase==='drawing'&&peaks.length===MAX_POINTS){phase='fading';fadeStart=performance.now();requestAnimationFrame(animate);}},650);
 }else hint.textContent='もう一か所タップできます';
}
function animate(now){
 if(phase!=='fading')return;
 const t=Math.min(1,(now-fadeStart)/FADE_MS),wave=Math.sin(Math.PI*t);
 drawContours(now,2+22*wave+10*t,Math.pow(1-t,1.15));
 if(t<1)requestAnimationFrame(animate);
 else{peaks=[];contours=[];phase='drawing';hint.textContent='画面をタップして地形をつくる';clearCanvas();}
}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();addPoint(e.clientX,e.clientY);},{passive:false});
reset.addEventListener('click',()=>{peaks=[];contours=[];phase='drawing';hint.textContent='画面をタップして地形をつくる';clearCanvas();});
addEventListener('resize',resize);
resize();
})();
</script>
</body>
</html>
